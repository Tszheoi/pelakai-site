<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Tszheoi Law</title>
<meta name="description" content="Tszheoi Law — The Unknown Developer">
<style>
  :root {
    --ink:   #2d3142;   /* 深藏青文字 */
    --accent:#52d6a8;   /* 薄荷绿 */
    --bg:    #ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0}

  html,body{height:100%}

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
                "Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 24px;
  }

  main{
    text-align:center;
    max-width:820px;
    width:100%;
  }

  h1,h2{
    font-weight:800;
    line-height:1.22;
    letter-spacing:-0.02em;
    font-size:clamp(30px, 5.4vw, 56px);
  }

  h1 .name{
    color:var(--accent);
    white-space:nowrap;   /* 让 "Tszheoi Law" 整体换行，不拆开 */
  }

  h2{
    margin-top:.18em;
  }

  .btn{
    display:inline-block;
    margin-top:clamp(34px, 6vw, 56px);
    padding:14px 34px;
    border:2px solid var(--accent);
    border-radius:4px;
    color:var(--accent);
    text-decoration:none;
    font-size:clamp(16px, 2.1vw, 20px);
    font-weight:700;
    letter-spacing:.02em;
    transition:background-color .22s ease, color .22s ease, transform .12s ease;
    -webkit-tap-highlight-color:transparent;
  }

  .btn:hover{
    background:var(--accent);
    color:#fff;
  }

  .btn:active{
    transform:scale(.97);
  }

  @media (prefers-reduced-motion: reduce){
    .btn{transition:none}
  }
</style>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
<main>
  <h1>Hi, my name is <span class="name">Tszheoi Law</span></h1>
  <h2>I'm the Unknown Developer.</h2>
  <a class="btn" id="know-more" href="#">Know more</a>
</main>

<script>
  // 动态拼出邮箱地址：
  // 1. 避免 Cloudflare 的「邮件地址混淆」改写 mailto 链接
  // 2. 顺带防止爬虫抓取明文邮箱
  (function () {
    var user = 'pelakai';
    var at = String.fromCharCode(64);          // @
    var host = 'mail.tszheoi-law' + '.top';
    var address = user + at + host;

    var btn = document.getElementById('know-more');
    if (!btn) return;

    function openMail(e) {
      if (e) e.preventDefault();
      window.location.href = 'mailto:' + address;
    }

    btn.addEventListener('click', openMail);
    // 允许右键/中键复制链接时拿到真实地址
    btn.setAttribute('href', 'mailto:' + address);
  })();
</script>
</body>
</html>
